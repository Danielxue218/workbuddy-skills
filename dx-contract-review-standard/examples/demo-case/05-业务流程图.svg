<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1476" width="1240" height="1476" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrGrayDark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#707070"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#C92C2C"/>
    </marker>
  </defs>

  <rect width="1240" height="1476" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <text x="620" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A" letter-spacing="1px">技术服务合同  ·  履约业务流程图</text>
  <text x="620" y="96" text-anchor="middle" font-size="13.5" fill="#606060" letter-spacing="0.5px">合同签署  →  预付款  →  交付  →  验收  →  进度款  →  质保期  →  尾款  →  履约完毕</text>

  <!-- 图例区 -->
  <g transform="translate(80, 128)">
    <text x="0" y="0" font-size="10.5" letter-spacing="4px" fill="#A0A0A0">图例</text>

    <rect x="0" y="14" width="14" height="14" rx="3" fill="#0070C0"/>
    <text x="22" y="25" font-size="11" fill="#4A4A4A">甲方节点</text>

    <rect x="92" y="14" width="14" height="14" rx="3" fill="#006A4E"/>
    <text x="114" y="25" font-size="11" fill="#4A4A4A">乙方节点</text>

    <rect x="184" y="14" width="14" height="14" rx="3" fill="#F6C12C"/>
    <text x="206" y="25" font-size="11" fill="#4A4A4A">双方节点</text>

    <rect x="266" y="14" width="14" height="14" rx="3" fill="#F5F0E1"/>
    <text x="288" y="25" font-size="11" fill="#4A4A4A">判断节点</text>

    <rect x="348" y="14" width="14" height="14" rx="3" fill="#C92C2C"/>
    <text x="370" y="25" font-size="11" fill="#4A4A4A">异常节点</text>

    <rect x="430" y="14" width="22" height="14" rx="7" fill="#003153"/>
    <text x="460" y="25" font-size="11" fill="#4A4A4A">终端节点</text>

    <line x1="556" y1="21" x2="584" y2="21" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="594" y="25" font-size="11" fill="#4A4A4A">主流程</text>

    <line x1="666" y1="21" x2="696" y2="21" stroke="#707070" stroke-width="1.8" marker-end="url(#arrGrayDark)"/>
    <text x="706" y="25" font-size="11" fill="#4A4A4A">循环回路</text>

    <line x1="796" y1="21" x2="824" y2="21" stroke="#C92C2C" stroke-width="1.8" marker-end="url(#arrRed)"/>
    <text x="834" y="25" font-size="11" fill="#4A4A4A">异常升级</text>
  </g>

  <!-- 起点终端节点 -->
  <rect x="470" y="180" width="300" height="68" rx="34" ry="34" fill="#003153"/>
  <text x="620" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">合同签署生效</text>
  <text x="620" y="232" text-anchor="middle" font-size="11" fill="#C8D4E0">双方盖章之日  ·  合同总金额 86 万元</text>
  <!-- 节点: 甲方支付预付款 -->
  <rect x="400" y="298" width="440" height="92" rx="14" ry="14" fill="#0070C0"/>
  <text x="620" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">甲方支付预付款</text>
  <text x="620" y="355" text-anchor="middle" font-size="12" fill="#D9EBF7">30%  ·  人民币 25.8 万元</text>
  <text x="620" y="375" text-anchor="middle" font-size="11" fill="#D9EBF7">合同签署之日起 5 个工作日内</text>
  <!-- 节点: 乙方开始履约 -->
  <rect x="400" y="430" width="440" height="92" rx="14" ry="14" fill="#006A4E"/>
  <text x="620" y="463" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">乙方开始履约</text>
  <text x="620" y="487" text-anchor="middle" font-size="12" fill="#D4E8DE">开发客户关系管理(CRM)系统</text>
  <text x="620" y="507" text-anchor="middle" font-size="11" fill="#D4E8DE">交付周期 12 个月  ·  中期第 6 月末里程碑</text>
  <!-- 节点: 乙方提交交付物 -->
  <rect x="400" y="562" width="440" height="92" rx="14" ry="14" fill="#006A4E"/>
  <text x="620" y="595" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">乙方提交交付物</text>
  <text x="620" y="619" text-anchor="middle" font-size="12" fill="#D4E8DE">系统源码 + 部署文档 + 培训材料</text>
  <text x="620" y="639" text-anchor="middle" font-size="11" fill="#D4E8DE">第 12 月末  ·  提交至甲方指定邮箱</text>
  <!-- 判断菱形: 甲方验收 -->
  <g transform="translate(620, 764)">
    <path d="M -172 -4
             L -8 -66
             Q 0 -70, 8 -66
             L 172 -4
             Q 180 0, 172 4
             L 8 66
             Q 0 70, -8 66
             L -172 4
             Q -180 0, -172 -4 Z"
          fill="#F5F0E1"/>
    <text x="0" y="-10" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2A2A">甲方验收</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" fill="#5A5A5A">15 个工作日内完成</text>
    <text x="0" y="32" text-anchor="middle" font-size="10.5" fill="#808080">按附件一技术规范书</text>
  </g>
  <!-- 节点: 甲方支付进度款 -->
  <rect x="400" y="882" width="440" height="92" rx="14" ry="14" fill="#0070C0"/>
  <text x="620" y="915" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">甲方支付进度款</text>
  <text x="620" y="939" text-anchor="middle" font-size="12" fill="#D9EBF7">60%  ·  人民币 51.6 万元</text>
  <text x="620" y="959" text-anchor="middle" font-size="11" fill="#D9EBF7">验收合格之日起 10 个工作日内</text>
  <!-- 节点: 质保期开始 -->
  <rect x="400" y="1014" width="440" height="92" rx="14" ry="14" fill="#F6C12C"/>
  <text x="620" y="1047" text-anchor="middle" font-size="16" font-weight="700" fill="#2A2A2A">质保期开始</text>
  <text x="620" y="1071" text-anchor="middle" font-size="12" fill="#3A3A3A">12 个月  ·  乙方免费修复缺陷</text>
  <text x="620" y="1091" text-anchor="middle" font-size="11" fill="#4A4A4A">响应 72 小时  ·  修复 5 工作日</text>
  <!-- 节点: 甲方支付尾款 -->
  <rect x="400" y="1146" width="440" height="92" rx="14" ry="14" fill="#0070C0"/>
  <text x="620" y="1179" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">甲方支付尾款</text>
  <text x="620" y="1203" text-anchor="middle" font-size="12" fill="#D9EBF7">10%  ·  人民币 8.6 万元</text>
  <text x="620" y="1223" text-anchor="middle" font-size="11" fill="#D9EBF7">质保期满后 15 个工作日内</text>
  <!-- 终点终端节点 -->
  <rect x="470" y="1278" width="300" height="58" rx="29" ry="29" fill="#003153"/>
  <text x="620" y="1312" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">合同履行完毕</text>  <line x1="620" y1="248" x2="620" y2="298" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="620" y1="390" x2="620" y2="430" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="620" y1="522" x2="620" y2="562" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="620" y1="654" x2="620" y2="690" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- 合格分支 -->
  <line x1="620" y1="834" x2="620" y2="878" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="593" y="842" width="54" height="22" rx="11" ry="11" fill="#006A4E"/>
  <text x="620" y="857" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">合格</text>
  <line x1="620" y1="974" x2="620" y2="1014" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="620" y1="1106" x2="620" y2="1146" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="620" y1="1238" x2="620" y2="1278" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- 不合格分支 -->
  <line x1="800" y1="764" x2="886" y2="764" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="813" y="753" width="54" height="22" rx="11" ry="11" fill="#C92C2C"/>
  <text x="840" y="768" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">不合格</text>

  <!-- 侧路节点: 乙方整改 -->
  <rect x="890" y="718" width="240" height="92" rx="14" ry="14" fill="#006A4E"/>
  <text x="1010" y="751" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">乙方整改</text>
  <text x="1010" y="775" text-anchor="middle" font-size="12" fill="#D4E8DE">按验收意见修改</text>
  <text x="1010" y="795" text-anchor="middle" font-size="11" fill="#D4E8DE">15 个工作日内</text>
  <!-- 循环回路(多段直线+转角圆角) -->
  <path d="M 1010 718
           L 1010 664
           L 740 664
           L 740 730"
        stroke="#707070" stroke-width="1.8" fill="none"
        stroke-linejoin="round"
        marker-end="url(#arrGrayDark)"/>
  <rect x="790" y="672" width="170" height="26" rx="13" ry="13" fill="#F6C12C"/>
  <text x="875" y="689" text-anchor="middle" font-size="11" font-weight="600" fill="#2A2A2A">整改完成  ·  重新验收</text>

  <!-- 异常升级箭头 -->
  <line x1="1010" y1="810" x2="1010" y2="858" stroke="#C92C2C" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <rect x="952" y="818" width="116" height="24" rx="12" ry="12" fill="#C92C2C"/>
  <text x="1010" y="834" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">累计 3 次不合格</text>

  <!-- 侧路节点: 合同解除 -->
  <rect x="890" y="862" width="240" height="92" rx="14" ry="14" fill="#C92C2C"/>
  <text x="1010" y="895" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">合同解除</text>
  <text x="1010" y="919" text-anchor="middle" font-size="12" fill="#F3D4D4">整改累计 3 次不合格</text>
  <text x="1010" y="939" text-anchor="middle" font-size="11" fill="#F3D4D4">触发第 14.2 条单方解除权</text>
</svg>
