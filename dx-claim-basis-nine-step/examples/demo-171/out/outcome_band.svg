<g data-role="notes">
<text x="60" y="310" font-size="12" font-weight="700" fill="#1A1A1A">关键不确定项</text>
<text x="60" y="334.0" font-size="12" fill="#606060">· 数额 T4 经《审核报告》结算协议+印章自认，前景转高——本应是第一决定性要件，被修正因素化解</text>
<text x="60" y="360.0" font-size="12" fill="#606060">· 主要残余胜负手=优先受偿权除斥期间起算点与行使方式（发函 vs 诉讼）</text>
<text x="60" y="386.0" font-size="12" fill="#606060">· 停工损失举证与因果较弱，很可能落入&#x27;其他诉请驳回&#x27;，故最可能为部分支持</text>
<text x="60" y="412.0" font-size="12" fill="#606060">· 程序前置抗辩弱（起诉在破产受理前）；裁定驳回起诉概率低</text>
</g>
<text data-role="worst-why" x="60" y="456.0" font-size="12" fill="#606060">最坏情形由来：若《审核报告》不被采信→造价鉴定→数额落空，且优先受偿权除斥期间抗辩成立（叠加最坏）</text>
